[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img-freq-extractor"
version = "0.1.0"
description = "画像の空間周波数帯域を 3 段階のカットオフで抽出する CLI (img_freq_web 由来)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Local Private User" }]
keywords = ["image", "fft", "spatial-frequency", "ai-image-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
img-freq-extractor = "img_freq_extractor.cli:main"
img-freq-webui = "img_freq_extractor.server:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
img_freq_extractor = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
